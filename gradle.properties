# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# ObjectBox's annotation processor requires kapt, which is incompatible with AGP's
# built-in Kotlin compilation (newDsl). Disabling both reverts :app to the classic
# Kotlin Gradle plugin toolchain so kapt/ObjectBox can work. See build_gotchas.md.
android.builtInKotlin=false
android.newDsl=false
# LiteRT ships `litert` and `litert-api` with the SAME Android namespace
# (com.google.ai.edge.litert). AGP 9 promoted duplicate namespaces from a warning to a
# hard failure in processDebugMainManifest, so the two artifacts cannot coexist without
# this flag — and both are required: `litert` holds Interpreter/InterpreterImpl and the
# native .so, `litert-api` holds InterpreterApi/Tensor. Excluding either one breaks the
# build or, worse, builds fine and throws NoClassDefFoundError at Interpreter creation.
#
# Upstream bug, open and unfixed: google-ai-edge/LiteRT#6965. This flag is the
# workaround the maintainers themselves point at. It is scheduled for eventual removal
# from AGP, so recheck when LiteRT gives the two artifacts distinct namespaces.
android.uniquePackageNames=false
